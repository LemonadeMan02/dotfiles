# Generato da matugen: non modificare, viene riscritto a ogni cambio di wallpaper
# Letto da qt6ct, che usa solo Dolphin (scripts/.local/bin/dolphin); salvare dalla GUI di qt6ct non serve, si perde al giro dopo

[Appearance]
style=Breeze
custom_palette=true
color_scheme_path=~/.local/state/qt6ct/colors.conf
# Breeze scuro o chiaro secondo la modalita' di Quickshell; le cartelle prendono l'accento dello schema
icon_theme=<* if {{ is_dark_mode }} *>breeze-dark<* else *>breeze<* endif *>
standard_dialogs=default
