# greetd: Hyprland minimale come compositor, dentro il greeter Quickshell
# Installato in /etc/greetd/config.toml; @USER@ diventa il tuo utente all'installazione
# Riferimento: man 5 greetd

[terminal]
# Lo stesso VT di SDDM
vt = 1

[default_session]
# GREETER_USER arriva a Quickshell attraverso Hyprland; systemd-cat manda l'output nel journal
command = "systemd-cat -t greeter-hyprland env GREETER_USER=@USER@ Hyprland -c /etc/greetd/hyprland.lua"
user = "greeter"
