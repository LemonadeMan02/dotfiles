# greetd: Hyprland minimale come compositor, dentro il greeter Quickshell
# Installato in /etc/greetd/config.toml; @USER@ diventa il tuo utente all'installazione
# Riferimento: man 5 greetd

[terminal]
# Lo stesso VT di SDDM
vt = 1

[default_session]
# Pulisce la console e avvia Hyprland col greeter: vedi greeter.sh
command = "/etc/greetd/greeter.sh @USER@"
user = "greeter"
