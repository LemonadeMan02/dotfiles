# Riferimento completo: `man kitty.conf` oppure https://sw.kovidgoyal.net/kitty/conf/
# Reload senza riavviare: ctrl+shift+F5, oppure `pkill -USR1 -x kitty`

# --- Font -------------------------------------------------------------------
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
# Ligature spezzate solo sotto il cursore, cosi' si modifica bene `->` e `!=`
disable_ligatures cursor

# --- Cursore ----------------------------------------------------------------
cursor_shape               beam
cursor_beam_thickness      1.8
cursor_blink_interval      0.5
cursor_stop_blinking_after 10.0
# Scia animata quando il cursore salta (0 = disattivata)
cursor_trail               3

# --- Scrollback e mouse -----------------------------------------------------
scrollback_lines 10000
url_style        curly
detect_urls      yes
copy_on_select   no

# --- Finestra ---------------------------------------------------------------
window_padding_width    10 12
# Hyprland disegna gia' i bordi: niente decorazioni client-side
hide_window_decorations yes
confirm_os_window_close 0
# Trasparenza leggera; il blur lo fa Hyprland
background_opacity         0.92
dynamic_background_opacity yes

# --- Tab --------------------------------------------------------------------
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted
tab_title_template  "{index}: {title}"

# --- Shell ------------------------------------------------------------------
# fish solo dentro kitty: la login shell resta bash (vedi Arch Wiki > Fish)
shell             fish
shell_integration enabled
# Notifica desktop se un comando lungo finisce mentre la finestra non ha focus
notify_on_cmd_finish unfocused 15.0

# --- Varie ------------------------------------------------------------------
enable_audio_bell     no
update_check_interval 0

# --- Scorciatoie (kitty_mod = ctrl+shift) -----------------------------------
# Solo override dei default: nuove finestre/tab nella directory corrente
# Default utili: kitty_mod+a>m / a>l opacita', kitty_mod+equal/minus font
map kitty_mod+enter launch --cwd=current
map kitty_mod+t     new_tab_with_cwd

# --- Colori -----------------------------------------------------------------
# Prima il fallback statico, poi la palette di matugen che lo sovrascrive
include colors-fallback.conf
# Se il file manca kitty logga un avviso e prosegue
include ~/.local/state/kitty/colors.conf
