# Idle: lock, poi monitor spenti (OLED); sospensione solo dopo averla testata a mano
# Riferimento: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

# Config Lua: hyprctl dispatch vuole un'espressione Lua, non la vecchia sintassi "dpms off"
$dpms_off = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
$dpms_on  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

general {
    # pidof evita una seconda istanza se il lock e' gia' attivo
    lock_cmd = pidof hyprlock || hyprlock
    # Lock prima del suspend: vale anche per "Sleep" dal launcher e dal dashboard
    before_sleep_cmd = loginctl lock-session
    # Al risveglio i monitor possono restare spenti
    after_sleep_cmd = $dpms_on
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: monitor spenti, niente barra statica sull'OLED
listener {
    timeout = 330
    on-timeout = $dpms_off
    on-resume = $dpms_on
}

