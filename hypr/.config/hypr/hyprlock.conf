# Schermata di lock: colori di matugen, Catppuccin Mocha come ripiego
# Riferimento: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

# Ripiego Catppuccin Mocha: valgono finche' matugen non ha generato il file sotto
$lock_text    = rgb(cdd6f4)
$lock_subtext = rgb(a6adc8)
$lock_outer   = rgb(cba6f7)
$lock_inner   = rgb(181825)
$lock_check   = rgb(f9e2af)
$lock_fail    = rgb(f38ba8)

# Ridefinisce le variabili sopra. Se il file manca, hyprlock logga l'errore
# e prosegue con il resto della config: restano i colori di ripiego
source = ~/.local/state/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    # Invio a vuoto non conta come tentativo fallito
    ignore_empty_input = true
}

# Schermo sfocato: nessun percorso di wallpaper da tenere in sincronia
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    color = $lock_text
    font_family = JetBrains Mono Bold
    font_size = 96
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $lock_subtext
    font_family = JetBrains Mono
    font_size = 20
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    # Come decoration.rounding e Theme.radiusM
    rounding = 10
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    placeholder_text = Password
    fail_text = $FAIL ($ATTEMPTS)
    outer_color = $lock_outer
    inner_color = $lock_inner
    font_color = $lock_text
    check_color = $lock_check
    # Rosso: qui e' davvero un errore
    fail_color = $lock_fail
    position = 0, -60
    halign = center
    valign = center
}
