# Schermata di lock: Catppuccin Mocha statico, matugen in un secondo passo
# Riferimento: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
    # Invio a vuoto non conta come tentativo fallito
    ignore_empty_input = true
}

# Schermo sfocato: nessun percorso di wallpaper da tenere in sincronia
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    color = rgb(cdd6f4)
    font_family = JetBrains Mono Bold
    font_size = 96
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(a6adc8)
    font_family = JetBrains Mono
    font_size = 20
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    # Come decoration.rounding e Theme.radiusM
    rounding = 10
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    placeholder_text = Password
    fail_text = $FAIL ($ATTEMPTS)
    outer_color = rgb(cba6f7)
    inner_color = rgb(181825)
    font_color = rgb(cdd6f4)
    check_color = rgb(f9e2af)
    # Rosso: qui e' davvero un errore
    fail_color = rgb(f38ba8)
    position = 0, -60
    halign = center
    valign = center
}
