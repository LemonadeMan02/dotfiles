# Avvio silenzioso. mkinitcpio unisce questo file a /etc/kernel/cmdline (root=, specifico
# della macchina, non versionato) e incorpora il risultato nella UKI: GRUB non passa
# parametri, quindi GRUB_CMDLINE_LINUX_DEFAULT in /etc/default/grub qui non conta.
# Riferimento: https://wiki.archlinux.org/title/Silent_boot
#
# quiet, loglevel=3: solo gli errori del kernel.
# rd.udev.log_level=3: idem per udev nell'initramfs.
# systemd.show_status=false: nessuna riga di stato di systemd, nemmeno i [FAILED];
# restano nel journal e in `systemctl --failed`.
quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=false
