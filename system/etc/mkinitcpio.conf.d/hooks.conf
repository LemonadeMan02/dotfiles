# Initramfs basato su systemd (il default di mkinitcpio da quando esiste): systemd-fsck
# rispetta quiet, mentre l'hook fsck con udev stampa sempre "/dev/...: clean, ...".
# sd-vconsole sostituisce keymap e consolefont. Sovrascrive HOOKS di /etc/mkinitcpio.conf.
HOOKS=(base systemd autodetect microcode modconf kms keyboard sd-vconsole block filesystems fsck)
