# Autologin su tty1: la vera schermata di login e' il lock Quickshell (qs-lock.service).
# Riferimento: https://wiki.archlinux.org/title/Getty#Automatic_login_to_virtual_console
# Avvio silenzioso (https://wiki.archlinux.org/title/Silent_boot): niente /etc/issue,
# niente riga "login: ... (automatic login)", e senza --noclear lo schermo si pulisce
# da quel che resta dell'avvio.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --skip-login --nonewline --noissue --autologin lemonademan %I $TERM
